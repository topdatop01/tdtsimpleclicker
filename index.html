<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TDTSimpleClicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p id="version">0.1.0-alpha</p>
    <header>
        <div class="head-left">
            <h3>TDTSimpleClicker</h3>
        </div>
        <div class="head-center">
            <div class="nav-buttons">
                <button class="active-button" id="nav-button-general">Главная</button>
                <button id="nav-button-shop">Магазин</button>
            </div>
        </div>
        <div class="head-right">

        </div>
    </header>
    <main id="main-general">
        <img src="assets/cookie.png" alt="Кликни чтобы заработать денег" id="cookie">
        <h1 class="balance">0₽ - (+1₽ за клик)</h1>
    </main>
    <main id="main-shop">
        <h1>Скоро...</h1>
    </main>
    <script>

        const cookie = document.getElementById("cookie");
        let nav_mains_set = {
            "nav-button-general": "main-general",
            "nav-button-shop": "main-shop"
        }

        let money = 0;
        let for_click = 1;

        function switch_main(id_of_main) {
            let all_mains = document.querySelectorAll("main");
            for (let i = 0; i < all_mains.length; i++) {
                all_mains[i].classList.add("hidden");
            }
            document.getElementById(id_of_main).classList.remove("hidden");
        }

        function switch_active_bttn_in_nav(id_of_bttn) {
            document.querySelector(".nav-buttons").querySelector(".active-button").classList.remove("active-button");
            document.getElementById(id_of_bttn).classList.add("active-button");
        }

        switch_main("main-general");

        for (let key in nav_mains_set) {
            document.getElementById(key).addEventListener("click", function() {
                document.querySelector(".nav-buttons").querySelector(".active-button").classList.remove("active-button");
                document.getElementById(key).classList.add("active-button");
                switch_main(nav_mains_set[key]);
            });
        }

        cookie.addEventListener("mousedown", function() {
            this.style.transform = "translate(-50%, -50%) scale(0.85)";
        });

        cookie.addEventListener("mouseup", function() {
            this.style.transform = "translate(-50%, -50%) scale(1)";
        });

        cookie.addEventListener("mouseleave", function() {
            this.style.transform = "translate(-50%, -50%) scale(1)";
        });

        cookie.addEventListener("touchstart", function(e) {
            e.preventDefault();
            this.style.transform = "scale(0.85)";
        });

        cookie.addEventListener("touchend", function() {
            this.style.transform = "scale(1)";
        });

        function spawnFloatingText(x, y) {
            const el = document.createElement("div");
            el.textContent = "+" + for_click;
            el.style.position = "fixed";
            el.style.left = x + "px";
            el.style.top = y + "px";
            el.style.fontSize = "30px";
            el.style.fontWeight = "bold";
            el.style.color = "#fff";
            el.style.textShadow = "0 0 10px rgba(255,255,255,0.5)";
            el.style.pointerEvents = "none";
            el.style.userSelect = "none";
            el.style.transition = "all 0.8s ease-out";
            el.style.opacity = "1"; // полностью видим при появлении
            document.body.appendChild(el);

            // Случайное направление по кругу
            const angle = Math.random() * 2 * Math.PI;
            const distance = 150 + Math.random() * 100;
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance;

            // Запускаем анимацию на следующем кадре
            requestAnimationFrame(() => {
                el.style.transform = `translate(${dx}px, ${dy}px)`;
                el.style.opacity = "0"; // плавно исчезает к концу
            });

            // Удаляем после завершения анимации
            setTimeout(() => {
                el.remove();
            }, 800);
        }

        cookie.addEventListener("click", function(e) {
            money = money + for_click;
            document.getElementById("main-general").querySelector(".balance").textContent = money + "₽ (+" + for_click + "₽ за клик)"
            const rect = cookie.getBoundingClientRect();
            const x = rect.left + rect.width / 2 - 15;
            const y = rect.top + rect.height / 2 - 15;
            spawnFloatingText(x, y);
        });
    </script>
</body>
</html>
